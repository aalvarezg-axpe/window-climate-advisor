[project]
name = "window-climate-advisor"
version = "0.0.0"
description = "Recommendation-only window and blind advisor for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest-homeassistant-custom-component==0.13.356",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=custom_components/window_climate_advisor",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/window_climate_advisor"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
