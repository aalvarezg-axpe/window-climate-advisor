        {{ resultado_reapertura_meteo.split('|')[0] | int(0) == 1 }}
      inicio_reapertura_actual: >-
        {{ resultado_reapertura_meteo.split('|')[1] | int(0) }}
      reapertura_meteo_permitida: >-
        {{ not bloqueo_reapertura_actual | bool }}

  - variables:
      # La media móvil exterior de 30 minutos ya aporta la estabilidad térmica:
      # no se añade una segunda espera antes de recomendar A u O. El aviso solo
      # se emite cuando además se cumplen los 30 minutos sin R.
      resultado_confirmacion_apertura: >-
        {% set pendientes = zonas_ventilacion_pendientes.split(',') %}
        {% set ns = namespace(confirmadas=[]) %}
        {% for z in zonas
             if z.clave not in pendientes
             and avisos_ordinarios_permitidos | bool %}
          {% set hallado = namespace(codigo='MM') %}
          {% for parte in codigo_actual.split('|') %}
            {% if parte.split('=') | count == 2
                  and parte.split('=')[0] == z.clave %}
              {% set hallado.codigo = parte.split('=')[1] %}
            {% endif %}
          {% endfor %}
          {% if hallado.codigo[0] in ['A', 'O'] %}
            {% set ns.confirmadas = ns.confirmadas + [z.clave] %}
          {% endif %}
        {% endfor %}
        {{ ns.confirmadas | join(',') ~ '|' }}

  - variables:
      zonas_apertura_confirmadas: >-
        {{ resultado_confirmacion_apertura.split('|')[0] | trim }}
      candidatos_apertura_actualizados: >-
        {{
          resultado_confirmacion_apertura.split('|')[1] | trim
          if resultado_confirmacion_apertura.split('|') | count > 1
          else ''
        }}

  # La apertura se sigue por habitación, no por franja completa. Una estancia
  # que empieza a compensar más tarde entra en el siguiente aviso consolidado
  # sin repetir las que continúan pendientes. Los dos huecos de Cocina usan c.
  - variables:
      habitaciones_ventilacion_pendientes: >-
        {% set pendientes = zonas_ventilacion_pendientes.split(',') %}
        {% set ns = namespace(codigos=[]) %}
