  - variables:
      zonas_abrir_nuevas_codigo: >-
        {% set confirmadas = zonas_apertura_confirmadas.split(',') %}
        {% set pendientes = zonas_ventilacion_pendientes.split(',') %}
        {% set ns = namespace(claves=[]) %}
        {% for z in zonas
             if z.habitacion in habitaciones_abrir_nuevas_codigos
             and z.clave in confirmadas
             and z.clave not in pendientes %}
          {% set ns.claves = ns.claves + [z.clave] %}
        {% endfor %}
        {{ ns.claves | join(',') }}

      # A -> O se confirma tras 5 minutos cuando la racha de referencia es
      # marginal, y de inmediato desde 20 km/h. Con la revisión /30, el caso
      # marginal se notificará normalmente en la siguiente evaluación. O -> A
      # conserva 10 minutos y el margen de 3 km/h ya aplicado al código.
      resultado_cambio_ao: >-
        {% set pendientes = zonas_ventilacion_pendientes.split(',') %}
        {% set minuto_actual = now().hour * 60 + now().minute %}
        {% set marca_actual = now().strftime('%H%M') %}
        {% set ns = namespace(claves=[], candidatos=[]) %}
        {% for z in zonas if z.clave in pendientes %}
          {% set actual = namespace(codigo='MM') %}
          {% set anterior = namespace(accion='C') %}
          {% for parte in codigo_actual.split('|') %}
            {% if parte.split('=') | count == 2
                  and parte.split('=')[0] == z.clave %}
              {% set actual.codigo = parte.split('=')[1] %}
            {% endif %}
          {% endfor %}
          {% for item in memoria_ventanas_previa.split(',') %}
            {% if item | length >= 2
                  and item[:-1] | int(-1) == z.indice | int %}
              {% set anterior.accion = item[-1] %}
            {% endif %}
          {% endfor %}
          {% set va = actual.codigo[0] %}
          {% if avisos_ordinarios_permitidos | bool
                and anterior.accion == 'A' and va == 'O' %}
            {% if racha_referencia_viento | float(0)
                  >= racha_degradacion_inmediata_kmh | float(20) %}
              {% set ns.claves = ns.claves + [z.clave] %}
            {% else %}
              {% set previo = namespace(marca='') %}
              {% for item in candidatos_cambio_apertura_previos.split(',') %}
                {% set partes = item.split(':') %}
                {% if partes | count == 2
                      and partes[0][:-1] | int(-1) == z.indice | int
                      and partes[0][-1] == 'O' %}
                  {% set previo.marca = partes[1] %}
                {% endif %}
              {% endfor %}
              {% set marca = previo.marca
                if previo.marca | length == 4 else marca_actual %}
              {% set minuto_inicio =
                marca[0:2] | int(0) * 60 + marca[2:4] | int(0) %}
              {% set transcurrido = minuto_actual - minuto_inicio %}
              {% if transcurrido < 0 %}
                {% set transcurrido = transcurrido + 1440 %}
              {% endif %}
              {% if transcurrido
                    >= minutos_confirmar_degradacion_marginal_viento | int(5) %}
                {% set ns.claves = ns.claves + [z.clave] %}
              {% else %}
                {% set ns.candidatos = ns.candidatos
                  + [z.indice ~ 'O:' ~ marca] %}
              {% endif %}
            {% endif %}
          {% elif avisos_ordinarios_permitidos | bool
                and reapertura_meteo_permitida | bool
                and anterior.accion == 'O' and va == 'A' %}
            {% set previo = namespace(marca='') %}
            {% for item in candidatos_cambio_apertura_previos.split(',') %}
              {% set partes = item.split(':') %}
              {% if partes | count == 2
                    and partes[0][:-1] | int(-1) == z.indice | int
                    and partes[0][-1] == 'A' %}
                {% set previo.marca = partes[1] %}
              {% endif %}
            {% endfor %}
            {% set marca = previo.marca
              if previo.marca | length == 4 else marca_actual %}
            {% set minuto_inicio =
              marca[0:2] | int(0) * 60 + marca[2:4] | int(0) %}
            {% set transcurrido = minuto_actual - minuto_inicio %}
            {% if transcurrido < 0 %}
              {% set transcurrido = transcurrido + 1440 %}
            {% endif %}
            {% if transcurrido
                  >= minutos_confirmar_mejora_apertura | int(10) %}
              {% set ns.claves = ns.claves + [z.clave] %}
            {% else %}
              {% set ns.candidatos = ns.candidatos
                + [z.indice ~ 'A:' ~ marca] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.claves | join(',') ~ '|' ~ ns.candidatos | join(',') }}

      zonas_abrir_cambio_codigo: >-
        {{ resultado_cambio_ao.split('|')[0] | trim }}

      candidatos_cambio_apertura_actualizados: >-
        {{ resultado_cambio_ao.split('|')[1] | trim
          if resultado_cambio_ao.split('|') | count > 1 else '' }}

      zonas_ventilacion_con_nuevas: >-
        {% set pendientes = zonas_ventilacion_pendientes.split(',') %}
        {% set nuevas = zonas_abrir_nuevas_codigo.split(',') %}
        {% set cambios = zonas_abrir_cambio_codigo.split(',') %}
