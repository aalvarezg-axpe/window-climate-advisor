          minutos_confirmar_reapertura_meteo | int(30) * 60 %}
        {% if hay_riesgo_meteo_actual | bool %}
          1|0
        {% elif bloqueo_reapertura_previo | bool %}
          {% if inicio_reapertura_previo | int(0) > 0
                and ahora - inicio_reapertura_previo | int(0) >= espera %}
            0|0
          {% else %}
            1|{{ inicio_reapertura_previo | int(0)
                 if inicio_reapertura_previo | int(0) > 0 else ahora }}
          {% endif %}
        {% else %}
          0|0
        {% endif %}

