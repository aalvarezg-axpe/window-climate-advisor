        {% set avisos = estado_avisos if estado_avisos is mapping else {} %}
        {% if 'rb' in avisos %}
          {{ avisos.get('rb', 0) | int(0) == 1 }}
        {% else %}
          {# Migración desde un estado anterior que todavía no tenía rb. #}
          {% set ns = namespace(valor=false) %}
          {% for parte in codigo_anterior.split('|') %}
            {% if parte.split('=') | count == 2
                  and parte.split('=')[1][0] == 'R' %}
              {% set ns.valor = true %}
            {% endif %}
          {% endfor %}
          {{ ns.valor }}
        {% endif %}

      inicio_reapertura_previo: >-
