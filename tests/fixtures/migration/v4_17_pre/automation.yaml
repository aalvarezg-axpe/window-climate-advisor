          {% if hallado.codigo[0] == 'A' %}
            {% if z.aviso not in ns.abrir %}
              {% set ns.abrir = ns.abrir + [z.aviso] %}
            {% endif %}
          {% elif hallado.codigo[0] == 'O' %}
            {% if z.aviso not in ns.oscilo %}
              {% set ns.oscilo = ns.oscilo + [z.aviso] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% set salida = namespace(partes=[]) %}
        {% if ns.abrir | count > 0 %}
          {% set salida.partes = salida.partes + ['Abre: ' ~ ns.abrir | join(', ')] %}
        {% endif %}
        {% if ns.oscilo | count > 0 %}
          {% set salida.partes = salida.partes + ['Oscilo: ' ~ ns.oscilo | join(', ')] %}
        {% endif %}
        {{ salida.partes | join(' · ') }}

      resumen_cierre_ventanas_verano: >-
        {% set ns = namespace(cerrar=[], persianas=[]) %}
        {% for z in zonas %}
          {% set hallado = namespace(codigo='MM') %}
          {% for parte in codigo_actual.split('|') %}
            {% if parte.split('=')[0] == z.clave %}
              {% set hallado.codigo = parte.split('=')[1] %}
            {% endif %}
          {% endfor %}
          {% if hallado.codigo[0] == 'F' %}
            {% if z.aviso not in ns.cerrar %}
              {% set ns.cerrar = ns.cerrar + [z.aviso] %}
            {% endif %}
            {% if hallado.codigo[1] == 'P' %}
              {% if z.aviso not in ns.persianas %}
                {% set ns.persianas = ns.persianas + [z.aviso] %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% set salida = namespace(partes=[]) %}
        {% if ns.cerrar | count > 0 %}
          {% set salida.partes = salida.partes + ['Cierra: ' ~ ns.cerrar | join(', ')] %}
        {% endif %}
        {% if ns.persianas | count > 0 %}
          {% set salida.partes = salida.partes + ['Persianas: ' ~ ns.persianas | join(', ')] %}
        {% endif %}
        {{ salida.partes | join(' · ') }}

      resumen_proteccion_solar_verano: >-
        {% set ns = namespace(zonas=[]) %}
        {% for z in zonas %}
          {% set hallado = namespace(codigo='MM') %}
          {% for parte in codigo_actual.split('|') %}
            {% if parte.split('=')[0] == z.clave %}
              {% set hallado.codigo = parte.split('=')[1] %}
            {% endif %}
          {% endfor %}
          {% if hallado.codigo[0] != 'F' and hallado.codigo[1] == 'P' %}
            {% if z.aviso not in ns.zonas %}
              {% set ns.zonas = ns.zonas + [z.aviso] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        Persianas: {{ ns.zonas | join(', ') }}

      resumen_subir_invierno: >-
        {% set ns = namespace(zonas=[]) %}
        {% for z in zonas %}
          {% set hallado = namespace(codigo='MM') %}
          {% for parte in codigo_actual.split('|') %}
            {% if parte.split('=')[0] == z.clave %}
              {% set hallado.codigo = parte.split('=')[1] %}
            {% endif %}
          {% endfor %}
          {% if hallado.codigo[1] == 'G' %}
            {% if z.aviso not in ns.zonas %}
              {% set ns.zonas = ns.zonas + [z.aviso] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        Sube: {{ ns.zonas | join(', ') }}

      resumen_ventilacion_invierno: >-
        {% set ns = namespace(abrir=[], moderado=[], oscilo=[]) %}
        {% for z in zonas %}
          {% set dif_instantanea =
            (((direccion_viento_instantanea | float
                - z.azimut + 180) % 360) - 180) | abs %}
          {% set dif_10m =
            (((direccion_viento_10m | float
                - z.azimut + 180) % 360) - 180) | abs %}
          {% if direccion_viento_instantanea_valida | bool
                and direccion_viento_10m_valida | bool %}
            {% set dif_conservadora = [dif_instantanea, dif_10m] | min %}
          {% elif direccion_viento_instantanea_valida | bool %}
            {% set dif_conservadora = dif_instantanea %}
          {% elif direccion_viento_10m_valida | bool %}
            {% set dif_conservadora = dif_10m %}
          {% else %}
            {% set dif_conservadora = 0 %}
          {% endif %}
          {% set dif_segura =
            [dif_conservadora - margen_direccion_lluvia_grados | float, 0] | max %}
          {% set factor_exposicion =
            cos(dif_segura * pi / 180) if dif_segura < 90 else 0 %}
          {% set limite_apertura = 20 - 10 * factor_exposicion %}

          {% if racha_referencia_viento | float < 10 %}
            {% if z.aviso not in ns.abrir %}
              {% set ns.abrir = ns.abrir + [z.aviso] %}
            {% endif %}
          {% elif racha_referencia_viento | float < limite_apertura %}
            {% if z.aviso not in ns.moderado %}
              {% set ns.moderado = ns.moderado + [z.aviso] %}
            {% endif %}
          {% elif racha_referencia_viento | float < 35 %}
            {% if z.aviso not in ns.oscilo %}
              {% set ns.oscilo = ns.oscilo + [z.aviso] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% set salida = namespace(partes=[]) %}
        {% if ns.abrir | count > 0 %}
          {% set salida.partes = salida.partes + ['Abre 5–10 min: ' ~ ns.abrir | join(', ')] %}
        {% endif %}
        {% if ns.moderado | count > 0 %}
          {% set salida.partes = salida.partes + ['Abre moderado: ' ~ ns.moderado | join(', ')] %}
        {% endif %}
        {% if ns.oscilo | count > 0 %}
          {% set salida.partes = salida.partes + ['Oscilo 5–10 min: ' ~ ns.oscilo | join(', ')] %}
        {% endif %}
        {{ salida.partes | join(' · ') }}

  - variables:
