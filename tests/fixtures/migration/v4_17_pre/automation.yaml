  # Una persiana solo genera un cambio tras 15 minutos continuados en la misma
  # acción física. M cancela candidatos, pero conserva la memoria notificada.
  - variables:
      resultado_estabilidad_persianas: >-
        {% set minuto_actual = now().hour * 60 + now().minute %}
        {% set marca_actual = now().strftime('%H%M') %}
        {% set ns = namespace(confirmadas=[], candidatos=[]) %}
        {% for z in zonas %}
          {% set actual = namespace(codigo='MM') %}
          {% set anterior = namespace(accion='') %}
          {% for parte in codigo_actual.split('|') %}
            {% if parte.split('=') | count == 2
                  and parte.split('=')[0] == z.clave %}
              {% set actual.codigo = parte.split('=')[1] %}
            {% endif %}
          {% endfor %}
          {% for item in memoria_persianas_previa.split(',') %}
            {% if item | length >= 2
                  and item[:-1] | int(-1) == z.indice | int %}
              {% set anterior.accion = item[-1] %}
            {% endif %}
          {% endfor %}
          {% set accion = 'B' if actual.codigo[1] in ['P', 'I'] else
            'S' if actual.codigo[1] in ['G', 'V'] else 'M' %}
          {% if avisos_ordinarios_permitidos | bool
                and accion in ['B', 'S']
                and accion != anterior.accion %}
            {% set previo = namespace(marca='') %}
            {% for item in candidatos_persiana_previos.split(',') %}
              {% set partes = item.split(':') %}
              {% if partes | count == 2
                    and partes[0][:-1] | int(-1) == z.indice | int
                    and partes[0][-1] == accion %}
                {% set previo.marca = partes[1] %}
              {% endif %}
            {% endfor %}
            {% set marca = previo.marca
              if previo.marca | length == 4 else marca_actual %}
            {% set minuto_inicio =
              marca[0:2] | int(0) * 60 + marca[2:4] | int(0) %}
            {% set transcurrido = minuto_actual - minuto_inicio %}
            {% if transcurrido < 0 %}
              {% set transcurrido = transcurrido + 1440 %}
            {% endif %}
            {% if transcurrido >= minutos_confirmar_persiana | int(15) %}
              {% set ns.confirmadas = ns.confirmadas
                + [z.indice ~ accion] %}
            {% else %}
              {% set ns.candidatos = ns.candidatos
                + [z.indice ~ accion ~ ':' ~ marca] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.confirmadas | join(',') ~ '|' ~ ns.candidatos | join(',') }}

  - variables:
      persianas_confirmadas: >-
        {{ resultado_estabilidad_persianas.split('|')[0] | trim }}
      candidatos_persiana_actualizados: >-
        {{ resultado_estabilidad_persianas.split('|')[1] | trim
          if resultado_estabilidad_persianas.split('|') | count > 1 else '' }}

  # No hay cupos diarios. Las fuentes de un aviso son exclusivamente una
  # apertura confirmada, un A/O confirmado, el cierre de un ciclo pendiente o
  # una persiana estable. Todas se agrupan en un único envío por evaluación.
  - variables:
      habitaciones_cambio_accion_codigos: >-
        {% set aperturas = zonas_abrir_nuevas_codigo.split(',') %}
        {% set cambios = zonas_abrir_cambio_codigo.split(',') %}
        {% set cierres = zonas_cerrar_fin_ventana_termica.split(',') %}
        {% set persianas = persianas_confirmadas.split(',') %}
        {% set ns = namespace(codigos=[]) %}
        {% for z in zonas %}
          {% set token_b = z.indice ~ 'B' %}
          {% set token_s = z.indice ~ 'S' %}
          {% if (z.clave in aperturas or z.clave in cambios
                or z.clave in cierres
                or token_b in persianas or token_s in persianas)
                and z.habitacion not in ns.codigos %}
            {% set ns.codigos = ns.codigos + [z.habitacion] %}
          {% endif %}
        {% endfor %}
        {{ ns.codigos | join('') }}

      zonas_ventilacion_resultantes: >-
        {% set cerrar = zonas_cerrar_fin_ventana_termica.split(',') %}
        {% set ns = namespace(claves=[]) %}
        {% for clave in zonas_ventilacion_con_nuevas.split(',')
             if clave | trim != '' and clave not in cerrar %}
          {% set ns.claves = ns.claves + [clave] %}
        {% endfor %}
        {{ ns.claves | join(',') }}

  - variables:
      detalle_porcentajes_persianas: >-
        {% set confirmadas = persianas_confirmadas.split(',') %}
        {% set ns = namespace(items=[]) %}
        {% for z in zonas %}
          {% if z.indice ~ 'B' in confirmadas
                or z.indice ~ 'S' in confirmadas %}
            {% set porcentaje = namespace(valor=-1) %}
            {% for p in porcentaje_persiana_zonas %}
              {% if p.get('clave', '') == z.clave %}
                {% set porcentaje.valor = p.get('pct', -1) | int(-1) %}
              {% endif %}
            {% endfor %}
            {% if porcentaje.valor >= 0 %}
              {% set etiqueta = z.nombre
                | replace(' con terraza', '')
                | replace(' con alero', '')
                | replace(' sin alero', '') %}
              {% set ns.items = ns.items
                + [etiqueta ~ ' ' ~ porcentaje.valor ~ ' %'] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items | join(', ') }}

  - variables:
      resumen_notificacion: >-
        {% set aperturas = zonas_abrir_nuevas_codigo.split(',') %}
        {% set cambios = zonas_abrir_cambio_codigo.split(',') %}
        {% set cierres = zonas_cerrar_fin_ventana_termica.split(',') %}
        {% set persianas = persianas_confirmadas.split(',') %}
        {% set salida = namespace(partes=[]) %}
        {% for habitacion in habitaciones_cambio_accion_codigos | list %}
          {% set h = namespace(nombre=habitacion, acciones=[]) %}
          {% for z in zonas if z.habitacion == habitacion %}
            {% set h.nombre = z.aviso %}
            {% set actual = namespace(codigo='MM') %}
            {% for parte in codigo_actual.split('|') %}
              {% if parte.split('=') | count == 2
                    and parte.split('=')[0] == z.clave %}
                {% set actual.codigo = parte.split('=')[1] %}
              {% endif %}
            {% endfor %}
            {% if z.clave in cierres and 'C' not in h.acciones %}
              {% set h.acciones = h.acciones + ['C'] %}
            {% elif (z.clave in aperturas or z.clave in cambios)
                  and actual.codigo[0] in ['A', 'O']
                  and actual.codigo[0] not in h.acciones %}
              {% set h.acciones = h.acciones + [actual.codigo[0]] %}
            {% endif %}
            {% if z.indice ~ 'S' in persianas and 'S' not in h.acciones %}
              {% set h.acciones = h.acciones + ['S'] %}
            {% endif %}
            {% if z.indice ~ 'B' in persianas and 'B' not in h.acciones %}
              {% set h.acciones = h.acciones + ['B'] %}
            {% endif %}
          {% endfor %}
          {% set plural = habitacion == 'c' %}
          {% set frases = namespace(items=[]) %}
          {% if 'A' in h.acciones %}
            {% set frases.items = frases.items
              + [('abre ventanas' if plural else 'abre ventana')] %}
          {% endif %}
          {% if 'O' in h.acciones %}
            {% set frases.items = frases.items
              + [('pon ventanas en oscilo' if plural else 'usa el oscilo')] %}
          {% endif %}
          {% if 'C' in h.acciones %}
            {% set frases.items = frases.items
              + [('cierra ventanas' if plural else 'cierra ventana')] %}
          {% endif %}
          {% if 'S' in h.acciones %}
            {% set frases.items = frases.items
              + [('sube persianas' if plural else 'sube persiana')] %}
          {% endif %}
          {% if 'B' in h.acciones %}
            {% set frases.items = frases.items
              + [('baja persianas' if plural else 'baja persiana')] %}
          {% endif %}
          {% if frases.items | count > 0 %}
            {% set salida.partes = salida.partes
              + [h.nombre ~ ': ' ~ frases.items | join(' + ')] %}
          {% endif %}
        {% endfor %}
        {{ salida.partes | join(' · ') }}{% if
          detalle_porcentajes_persianas | trim != '' %} · Objetivo de apertura:
          {{ detalle_porcentajes_persianas }}{% endif %}. Fuera
        {{ t_exterior | float | round(1) }}°.

  # Un solo aviso reúne todos los cambios confirmados en esta evaluación.
  - if:
      - condition: template
        value_template: >-
          {{ habitaciones_cambio_accion_codigos | trim != '' }}
    then:
      - action: notify.mobile_app_cph1919
        data:
          title: >-
            {{ '🌙 Fin de jornada' if id_disparo == 'fin_jornada'
              else '🌡️ Asesor de la casa' }}
          message: "{{ resumen_notificacion }}"
          data:
            tag: asesor_ventanas_casa
            group: clima

  - variables:
      memoria_ventanas_nueva: >-
        {% set aperturas = zonas_abrir_nuevas_codigo.split(',') %}
        {% set cambios = zonas_abrir_cambio_codigo.split(',') %}
        {% set cierres = zonas_cerrar_fin_ventana_termica.split(',') %}
        {% set ns = namespace(items=[]) %}
        {% for z in zonas %}
          {% set anterior = namespace(accion='C') %}
          {% set actual = namespace(codigo='MM') %}
          {% for item in memoria_ventanas_previa.split(',') %}
            {% if item | length >= 2
                  and item[:-1] | int(-1) == z.indice | int %}
              {% set anterior.accion = item[-1] %}
            {% endif %}
          {% endfor %}
          {% for parte in codigo_actual.split('|') %}
            {% if parte.split('=') | count == 2
                  and parte.split('=')[0] == z.clave %}
              {% set actual.codigo = parte.split('=')[1] %}
            {% endif %}
          {% endfor %}
          {% if z.clave in cierres %}
            {% set accion = 'C' %}
          {% elif (z.clave in aperturas or z.clave in cambios)
                and actual.codigo[0] in ['A', 'O'] %}
            {% set accion = actual.codigo[0] %}
          {% else %}
            {% set accion = anterior.accion %}
          {% endif %}
          {% set ns.items = ns.items + [z.indice ~ accion] %}
        {% endfor %}
        {{ ns.items | join(',') }}

      memoria_persianas_nueva: >-
        {% set confirmadas = persianas_confirmadas.split(',') %}
        {% set ns = namespace(items=[]) %}
        {% for z in zonas %}
          {% set anterior = namespace(accion='') %}
          {% for item in memoria_persianas_previa.split(',') %}
            {% if item | length >= 2
                  and item[:-1] | int(-1) == z.indice | int %}
              {% set anterior.accion = item[-1] %}
            {% endif %}
          {% endfor %}
          {% if z.indice ~ 'B' in confirmadas %}
            {% set accion = 'B' %}
          {% elif z.indice ~ 'S' in confirmadas %}
            {% set accion = 'S' %}
          {% else %}
            {% set accion = anterior.accion %}
          {% endif %}
          {% if accion in ['B', 'S'] %}
            {% set ns.items = ns.items + [z.indice ~ accion] %}
          {% endif %}
        {% endfor %}
        {{ ns.items | join(',') }}

      estado_notificaciones_nuevo: >-
        {{
          {
            'd': fecha_ciclo_avisos,
            'w': memoria_ventanas_nueva,
            'b': memoria_persianas_nueva,
            'bc': candidatos_persiana_actualizados,
            'wc': candidatos_cambio_apertura_actualizados
          } | to_json | replace(': ', ':') | replace(', ', ',')
        }}

  - if:
      - condition: template
        value_template: >-
          {{ states('input_text.asesor_ventanas_estado_notificaciones')
            != estado_notificaciones_nuevo }}
    then:
      - action: input_text.set_value
        target:
          entity_id: input_text.asesor_ventanas_estado_notificaciones
        data:
          value: "{{ estado_notificaciones_nuevo }}"

  # El código bruto se conserva para diagnóstico; la deduplicación real está
  # en las memorias w/b y no se borra al aparecer M ni al recuperar sensores.
  - if:
      - condition: template
        value_template: "{{ codigo_actual != codigo_anterior }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: input_text.ultima_recomendacion_ventanas
        data:
          value: "{{ codigo_actual }}"

  # Este ayudante no impone cupos diarios. Conserva el ciclo supuesto de
  # ventanas y el bloqueo tras riesgo meteorológico. ct/oa se mantienen vacíos
  # durante la migración para limpiar candidatos térmicos de versiones previas.
  - variables:
      estado_avisos_nuevo: >-
        {{
          {
            'd': fecha_ciclo_avisos,
            'av': zonas_ventilacion_resultantes,
            'ct': candidatos_cierre_actualizados,
            'oa': candidatos_apertura_actualizados,
            'rb': 1 if bloqueo_reapertura_actual | bool else 0,
            'rs': inicio_reapertura_actual | int(0)
          } | to_json | replace(': ', ':') | replace(', ', ',')
        }}

  - if:
      - condition: template
        value_template: >-
          {{ states('input_text.asesor_ventanas_avisos_diarios') != estado_avisos_nuevo }}
    then:
      - action: input_text.set_value
        target:
          entity_id: input_text.asesor_ventanas_avisos_diarios
        data:
          value: "{{ estado_avisos_nuevo }}"

mode: restart
