        {% for z in zonas %}
          {% if (z.clave in pendientes or z.clave in nuevas
                or z.clave in cambios)
                and z.clave not in ns.claves %}
            {% set ns.claves = ns.claves + [z.clave] %}
          {% endif %}
        {% endfor %}
        {{ ns.claves | join(',') }}

