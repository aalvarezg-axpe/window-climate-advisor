  - variables:
      habitaciones_abrir_nuevas_codigos: >-
        {% set confirmadas = zonas_apertura_confirmadas.split(',') %}
        {% set pendientes = zonas_ventilacion_pendientes.split(',') %}
        {% set ns = namespace(codigos=[]) %}
        {% if reapertura_meteo_permitida | bool
              and avisos_ordinarios_permitidos | bool %}
          {% for z in zonas
               if z.clave in confirmadas and z.clave not in pendientes %}
            {% if z.habitacion not in ns.codigos %}
